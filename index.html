<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B8F7A">
<meta name="mobile-web-app-capable" content="yes">
<title>Masdjid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div id="app">
<header><button id="back" aria-label="Retour">←</button><h1 id="title"></h1><span id="roleTag" class="badge" hidden></span><button id="streakBtn" class="streak"></button><button id="langBtn"></button><button id="meBtn"></button></header>
<main>
 <section class="screen on" id="s-map">
  <div id="map"></div>
  <div id="routeBar"><div class="grow"><b id="rtTime"></b><div class="small" id="rtSub" style="color:#fff;opacity:.9"></div></div><button id="rtClose" aria-label="Fermer">×</button></div>
  <div id="bottom">
   <button class="fab" id="locate" aria-label="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
   <div id="cards"></div>
  </div>
 </section>

 <section class="screen" id="s-prayers">
  <select id="pm" aria-label="Mosquée"></select>
  <div id="pmNote"></div>
  <div class="next"><div class="small" id="tNext" style="color:#fff;opacity:.85"></div><div class="big" id="nextName">–</div><div id="nextIn" style="font-weight:600">–</div></div>
  <div class="card times" id="times"></div>
  <div id="serieBox"></div>
  <div class="card row">
   <svg id="needle" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="2"/><path d="M32 6 40 34H24Z" fill="var(--brand)"/><path d="M32 58 24 34H40Z" fill="currentColor" fill-opacity=".25"/></svg>
   <div class="grow"><h2 id="tQibla"></h2><div class="muted" id="qibla">–</div></div>
  </div>
 </section>

 <section class="screen" id="s-stories">
  <div class="stories" id="storyRow"></div>
  <div id="pubBox"></div>
  <p class="small" id="storiesNote"></p>
 </section>

 <section class="screen" id="s-rdv">
  <div id="genderBox"></div>
  <button class="btn" id="newRdv"></button>
  <div style="height:16px"></div>
  <div id="rdvList"></div>
 </section>

 <section class="screen" id="s-rappels"><div id="prayBanner" class="pbar" role="status" aria-live="polite"></div><div id="rapTabs"></div><div id="feed"></div></section>
 <section class="screen" id="s-cours"><div id="coursBody"></div></section>
 <section class="screen" id="s-account"><div id="accountBody"></div></section>
 <section class="screen" id="s-more"><div id="moreBody"></div></section>
 <section class="screen" id="s-family"><div id="familyBody"></div></section>
 <section class="screen" id="s-discover"><div id="discoverBody"></div></section>
 <section class="screen" id="s-qr"><div id="qrBody"></div></section>
 <section class="screen" id="s-settings"><div id="settingsBody"></div></section>
 <section class="screen" id="s-join"><div id="joinBody"></div></section>
 <section class="screen" id="s-mosque"><div id="mosqueBody"></div></section>
</main>
<nav id="nav" aria-label="Navigation"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" inert></div>
<div id="scrim"></div>
<div id="viewer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="i18n.js?v=4"></script>
<script src="extra-i18n.js?v=4"></script>
<script src="mosques.js?v=4"></script>
<script src="prayertimes.js?v=4"></script>
<script src="features.js?v=4"></script>
<script src="features2.js?v=4"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('m_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('m_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',(navigator.language||'fr').slice(0,2));if(!TR[lang])lang='fr';
const t=(k,v)=>{let s=(TR[lang]&&TR[lang][k])||TR.fr[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
 map:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 prayers:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 stories:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="4"/></svg>',
 rdv:'<svg viewBox="0 0 24 24"><path d="M5 17H3v-5l2-5h14l2 5v5h-2M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>', // Trajets = voiture
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
 // mosquée : dôme surmonté du croissant + minaret (l'ancien dessin ressemblait à une cloche)
 dome:'<svg viewBox="0 0 24 24"><path d="M2 21h20M4 21v-6h12v6M4.5 15c0-3.2 2.6-4.6 5.5-7 2.9 2.4 5.5 3.8 5.5 7M10 8V6M18.5 21V10.5h2.5V21M18.5 10.5l1.25-2.5 1.25 2.5M8.5 21v-2.6a1.5 1.5 0 0 1 3 0V21"/><path d="M10.9 3.1a1.5 1.5 0 1 0 0 2.4 1.9 1.9 0 0 1 0-2.4z"/></svg>',
 family:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M2 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5M15 20c0-2.5 1.5-4 4-4s3 1.5 3 4"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6M20 4v14h-6"/></svg>',
 qr:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7h-3"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 car:'<svg viewBox="0 0 24 24"><path d="M5 17H3v-5l2-5h14l2 5v5h-2M5 12h14"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/></svg>',
 rappels:ICON_RAP,user:ICON_USER,
 check:'<svg viewBox="0 0 24 24"><path d="M12 1l3 2 3.5-.2 1.2 3.3 3 1.9-1.2 3.3 1.2 3.3-3 1.9-1.2 3.3L15 21l-3 2-3-2-3.5.2-1.2-3.3-3-1.9 1.2-3.3L.3 8.9l3-1.9L4.5 3.8 8 4z"/><path d="M8 12l3 3 5-6" stroke="#fff" fill="none" stroke-width="2"/></svg>'
};
// 5 onglets : l'essentiel d'abord (prochaine prière), les vidéos ensuite. Les stories passent dans « Plus ».
const TABS=['prayers','map','rdv','rappels','more'];
const SUB={family:'more',discover:'more',qr:'more',settings:'more',account:'more',cours:'more',join:'more',stories:'more',mosque:'map'};
let cur='prayers';
// toast : message court lu par les lecteurs d'écran ; avec {action} il propose « Annuler » (ou un autre bouton) pendant 6 s
let toastT;
const toast=(m,o={})=>{const x=$('#toast');x.textContent='';const s=document.createElement('span');s.textContent=m;x.append(s);
 if(o.action){const b=document.createElement('button');b.textContent=o.label||t('undo');b.onclick=()=>{x.classList.remove('on');o.action()};x.append(b)}
 x.classList.toggle('act',!!o.action);x.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>x.classList.remove('on'),o.action?6000:Math.max(3500,m.length*60))};
// distances au format de la langue : « 5,8 km » en français (chiffres latins partout)
const fmtKm=d=>{try{return d.toLocaleString(lang+'-u-nu-latn',{minimumFractionDigits:1,maximumFractionDigits:1})+' km'}catch(e){return d.toFixed(1)+' km'}};

/* ---------- données d'exemple (fictives) ---------- */
const TOULOUSE={lat:43.6047,lng:1.4442}; // ville de départ du projet
let pos=store.get('pos',TOULOUSE);
const STORIES={};
const PRAYERS=['jumua','fajr','dhuhr','asr','maghrib','isha','tarawih','eid'];
const dist=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const mq=id=>id===99?DEMO:MOSQUEES.find(m=>m.id===id);

/* ---------- navigation ---------- */
function go(k){
 if(tempPm&&k!=='prayers'){tempPm=false;prayMosque=store.get('pm',0);fillPm();loadTimes()} // on revient à la mosquée enregistrée
 cur=k;const tab=SUB[k]||k;
 $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));
 $$('#nav button').forEach(b=>{const on=b.dataset.t===tab;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 $('#sheet').classList.remove('on');applySectionColor(tab);
 $('#back').style.display=SUB[k]?'block':'none';$('#app').classList.toggle('sub',!!SUB[k]);
 $('#back').textContent=RTL.includes(lang)?'→':'←';
 setTitle();renderCurrent();setImmersive(k==='rappels');
 if(k==='map'&&map)setTimeout(()=>map.invalidateSize(),50);
}
// vidéos : fond sombre et en-tête masqué, mais plus de plein écran forcé (on garde la barre d'état du téléphone)
function setImmersive(on){$('#app').classList.toggle('immersive',on)}
function renderMeBtn(){const b=$('#meBtn'),e=getProfile().emoji;if(!b)return;b.innerHTML=e?esc(e):I.user;b.setAttribute('aria-label',t('account'))}
function setTitle(){renderMeBtn();$('#title').textContent=cur==='map'?t('mosques'):cur==='mosque'?t('mosquePage'):t(cur==='discover'?'discover':cur)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
$('#back').onclick=()=>go(SUB[cur]==='map'?'map':'more');
function renderCurrent(){
 ({cours:renderCours,prayers:renderSerie,rappels:renderRappels,account:renderAccount,rdv:renderRdv,more:renderMore,family:renderFamily,discover:renderDiscover,qr:renderQr,settings:renderSettings,join:renderJoin,mosque:renderMosquePage}[cur]||(()=>{}))();
}

/* ---------- langue ---------- */
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=RTL.includes(lang)?'rtl':'ltr';
 $('#langBtn').textContent='🌐 '+lang.toUpperCase();
 $('#nav').innerHTML=TABS.map(k=>{const on=(SUB[cur]||cur)===k;return `<button data-t="${k}" class="${on?'on':''}"${on?' aria-current="page"':''}>${I[k]}<span>${t(k)}</span></button>`}).join('');
 $('#locate').setAttribute('aria-label',t('locate'));$('#back').setAttribute('aria-label',t('back'));$('#rtClose').setAttribute('aria-label',t('close'));$('#pm').setAttribute('aria-label',t('mosque'));$('#nav').setAttribute('aria-label',t('navLabel'));$('#tNext').textContent=t('nextPrayer');$('#tQibla').textContent=t('qibla');
 $('#storiesNote').textContent=t('storiesNote');$('#newRdv').textContent=t('newRdv');
 setTitle();fillPm();renderList();loadTimes();renderStories();renderRole();renderRdv();renderCurrent();renderStreakBadge();
 $('#back').textContent=RTL.includes(lang)?'→':'←';
}
function pickLang(){
 $('#sheet').innerHTML=`<h2 style="margin-bottom:12px">${t('language')}</h2><div class="chips" style="margin:0 0 16px">${Object.keys(LANGS).map(k=>`<button class="chip ${k===lang?'on':''}" data-l="${k}">${LANGS[k]}</button>`).join('')}</div><button class="btn ghost" id="lcl">${t('close')}</button>`;
 $('#sheet').classList.add('on');$('#lcl').onclick=()=>$('#sheet').classList.remove('on');
}
$('#sheet').addEventListener('click',e=>{const c=e.target.closest('[data-l]');if(c){lang=c.dataset.l;store.set('lang',lang);$('#sheet').classList.remove('on');applyLang()}});
$('#langBtn').onclick=pickLang;
$('#meBtn').onclick=()=>go('account');
$('#scrim').onclick=()=>$('#sheet').classList.remove('on'); // toucher en dehors ferme la fenêtre
// fenêtre du bas accessible : hors d'atteinte quand elle est fermée, focus dedans à l'ouverture, rendu au bouton d'origine à la fermeture
let sheetBack=null;
new MutationObserver(()=>{
 const s=$('#sheet'),on=s.classList.contains('on');
 if(on&&s.inert){s.inert=false;sheetBack=document.activeElement;const h=s.querySelector('h2');s.setAttribute('aria-label',h?h.textContent:'');const f=s.querySelector('button,select,input,a[href]');if(f)setTimeout(()=>f.focus({preventScroll:true}),60)}
 else if(!on&&!s.inert){s.inert=true;if(sheetBack&&document.contains(sheetBack))sheetBack.focus({preventScroll:true});sheetBack=null}
}).observe($('#sheet'),{attributes:true,attributeFilter:['class']});
// formulaires : chaque <label> posé juste avant son champ lui donne son nom (lecteurs d'écran) ; sinon le texte d'aide sert de nom
let _lblRaf=0;
function linkLabels(){
 _lblRaf=0;
 $$('#app label:not([for])').forEach(l=>{if(l.querySelector('input,select,textarea'))return;let n=l.nextElementSibling;
  if(n&&!/^(INPUT|SELECT|TEXTAREA)$/.test(n.tagName))n=n.querySelector&&n.querySelector('input,select,textarea');
  if(n&&n.id)l.htmlFor=n.id});
 $$('#app input:not([type=checkbox]):not([aria-label]),#app select:not([aria-label]),#app textarea:not([aria-label])').forEach(f=>{
  if(f.id&&document.querySelector(`label[for="${f.id}"]`))return;const ph=f.getAttribute('placeholder')||(f.previousElementSibling&&f.previousElementSibling.textContent)||'';if(ph.trim())f.setAttribute('aria-label',ph.trim())});
}
new MutationObserver(()=>{if(!_lblRaf)_lblRaf=setTimeout(linkLabels,0)}).observe($('#app'),{childList:true,subtree:true});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#viewer').classList.contains('on'))return closeStory();if($('#sheet').classList.contains('on'))$('#sheet').classList.remove('on')});

/* ---------- carte (style navigation) ---------- */
let map,pins={},userMk,routeLines=[],selected=null,watchId=null;
const isDark=()=>{const r=document.documentElement.dataset.theme;return r==='dark'||(r!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};
const pinIcon=(m,sel)=>L.divIcon({className:'pin'+(sel?' sel':''),html:'<div class="pinb" style="background:'+m.color+'">'+I.dome+'</div>',iconSize:[40,46],iconAnchor:[8,44]});
function initMap(){
 if(!window.L){$('#map').innerHTML='<div class="muted" style="padding:24px">…</div>';return}
 map=L.map('map',{zoomControl:false,attributionControl:false}).setView([pos.lat,pos.lng],12);
 if(isDark())$('#map').classList.add('dark-tiles');
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
 L.control.attribution({prefix:false,position:'topright'}).addAttribution('© OpenStreetMap').addTo(map);
 MOSQUEES.forEach(m=>{pins[m.id]=L.marker([m.lat,m.lng],{icon:pinIcon(m)}).addTo(map).on('click',()=>selectMosque(m.id))});
 userMk=L.marker([pos.lat,pos.lng],{icon:meIcon(),interactive:false,zIndexOffset:900}).addTo(map);
 const b=L.latLngBounds(MOSQUEES.filter(m=>dist(pos,m)<12).map(m=>[m.lat,m.lng]).concat([[pos.lat,pos.lng]]));map.fitBounds(b,{paddingTopLeft:[30,30],paddingBottomRight:[30,260]});
}
function renderList(){renderCards()}
function renderCards(){
 const l=MOSQUEES.map(m=>({...m,d:dist(pos,m)})).sort((a,b)=>a.d-b.d);
 // carte mosquée : 2 groupes clairs — « y aller » (itinéraire, Waze, Maps) puis « la mosquée » (covoiturage, sa page)
 // chaque carte dit tout de suite la prochaine prière (et la Jumu'a si la mosquée la publie) ; distance « depuis le centre » tant que la position n'est pas connue
 const nx=m=>{const T=timesFor(m),n=nextOf(T.h);return `<div class="mnext"><span>${t('nextShort',{p:t(n.k),h:n.at})}</span>${T.jumua?`<span>${t('jumua')} ${T.jumua}</span>`:''}</div>`};
 const km=m=>fmtKm(m.d)+(hasFix?'':'<br>'+t('fromCenterShort'));
 $('#cards').innerHTML=l.map(m=>`<div class="mcard ${m.id===selected?'sel':''}" data-id="${m.id}"><button class="mhead row" data-act="sel" aria-label="${esc(m.nom+', '+fmtKm(m.d))}"><div class="ico" style="background:${m.color}">${I.dome}</div><div class="grow"><b>${esc(m.nom)}</b><div class="small">${esc(m.adr)}</div></div><div class="small mkm">${km(m)}</div></button>${nx(m)}
 <div class="acts"><button class="btn" data-act="route">${t('route')}</button><a class="btn ghost" target="_blank" rel="noopener" href="https://waze.com/ul?ll=${m.lat},${m.lng}&navigate=yes">Waze</a><a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=driving">Maps</a></div>
 <div class="more"><button class="chip" data-act="cov">${t('carpool')}</button><button class="chip" data-act="page">${t('mosquePage')}</button></div></div>`).join('')+`<div class="mcard addMq"><b>${t('notListed')}</b><button class="btn" data-act="join">${t('joinBtn')}</button></div>`;
}
$('#cards').onclick=e=>{
 const c=e.target.closest('.mcard');if(!c)return;const id=+c.dataset.id,a=e.target.closest('[data-act]');
 if(a&&a.dataset.act==='join')return go('join');
 if(!c.dataset.id)return;
 if(!a||a.dataset.act==='sel')return selectMosque(id,true);
 if(a.dataset.act==='route')showRoute(id);else if(a.dataset.act==='cov')newRdvSheet(id);else if(a.dataset.act==='page')openMosquePage(id);
};
function selectMosque(id,fromCard){
 selected=id;const m=mq(id);
 for(const k in pins)pins[k].setIcon(pinIcon(mq(+k),+k===id));
 renderCards();
 const c=$('#cards').querySelector('[data-id="'+id+'"]');if(c&&!fromCard)c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
 if(map)map.flyTo([m.lat,m.lng],Math.max(map.getZoom(),14),{duration:.6});
}
async function showRoute(id){
 const m=mq(id);selected=id;renderCards();clearRoute();
 const from=dist(pos,TOULOUSE)<60?pos:TOULOUSE;
 try{
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${m.lng},${m.lat}?overview=full&geometries=geojson`);
  const j=await r.json(),rt=j.routes[0],pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
  routeLines=[L.polyline(pts,{color:'#fff',weight:10,opacity:.95}).addTo(map),L.polyline(pts,{color:'#0B8F7A',weight:6}).addTo(map)];
  map.fitBounds(routeLines[1].getBounds(),{paddingTopLeft:[40,90],paddingBottomRight:[40,260]});
  $('#rtTime').textContent=t('routeInfo',{m:Math.max(1,Math.round(rt.duration/60)),d:fmtKm(rt.distance/1000).replace(' km','')});
  $('#rtSub').textContent=m.nom+' · '+(from===pos&&hasFix?t('fromYou'):t('fromCenter'));
  $('#routeBar').classList.add('on');
 }catch(e){toast(t('routeFail'),{label:t('retry'),action:()=>showRoute(id)})}
}
function clearRoute(){routeLines.forEach(l=>map.removeLayer(l));routeLines=[];$('#routeBar').classList.remove('on')}
$('#rtClose').onclick=clearRoute;
// (l'ancienne fiche « Infos » est fusionnée dans la page de la mosquée : adresse, site, Mawaqit, source des horaires)
let hasFix=false;
function onFix(p,first){
 pos={lat:p.coords.latitude,lng:p.coords.longitude};store.set('pos',pos);hasFix=true;
 if(userMk)userMk.setLatLng([pos.lat,pos.lng]);
 renderCards();
 if(first){loadTimes();if(map)map.flyTo([pos.lat,pos.lng],14,{duration:.8});toast(t('posOk'))}
}
$('#locate').onclick=()=>{
 if(!navigator.geolocation)return toast(t('posNo'));
 if(watchId!==null&&hasFix){if(map)map.flyTo([pos.lat,pos.lng],15,{duration:.6});return}
 let first=true;
 watchId=navigator.geolocation.watchPosition(p=>{onFix(p,first);first=false},()=>{toast(t('posNo'));watchId=null},{enableHighAccuracy:true,maximumAge:5000});
};

/* ---------- prières (par mosquée) ---------- */
const KEYS=['fajr','dhuhr','asr','maghrib','isha'],API={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
// Méthode du site de la mosquée du Mirail : Ligue islamique mondiale, Fajr/Isha 15°, Dhuhr +1 min, Maghrib +5 min
const MIRAIL_Q='&method=99&methodSettings=15,null,15&tune=0,0,0,1,0,5,0,0,0';
const addMin=(h,n)=>{const[a,b]=h.split(':').map(Number),t=a*60+b+n;return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
/* Horaires TOUJOURS justes, jamais inventés :
   1) mosquée Mawaqit → son calendrier officiel (dans l'appli, marche hors ligne)
   2) sinon → calcul sur le téléphone (prayertimes.js, mêmes formules que l'API, à la minute près), affiché tout de suite
   3) puis l'API Aladhan confirme quand il y a du réseau ; sa réponse est gardée en mémoire pour la journée. */
const methodOf=m=>m&&m.src==='mirail'?'mirail':'france12';
function timesFor(m,p,date){ // horaires d'un jour pour une mosquée (ou un point) : {h, iq, jumua, mode}
 const d=date||new Date();
 if(m&&m.src==='mawaqit'&&MAWAQIT[m.id]){
  const W=MAWAQIT[m.id],row=W.cal[d.getMonth()][d.getDate()],iq=(W.iqama[d.getMonth()]||{})[d.getDate()];
  const h={fajr:row[0],dhuhr:row[2],asr:row[3],maghrib:row[4],isha:row[5]};let q=null;
  if(iq){q={};KEYS.forEach((k,n)=>{const v=iq[n];q[k]=/^\+/.test(v)?addMin(h[k],+v.slice(1)):v})}
  return{h,iq:q,jumua:W.jumua,mode:'mawaqit'};
 }
 const pt=p||(m?{lat:m.lat,lng:m.lng}:TOULOUSE),r=PT.times(d,pt.lat,pt.lng,PT.METHODS[methodOf(m)]),h={};
 KEYS.forEach(k=>h[k]=r[k]);return{h,iq:null,jumua:null,mode:'local'};
}
let prayMosque=store.get('pm',0),horaires=timesFor(null,TOULOUSE).h,timesMode='local',timesDay='',timesReq=0,iqama=null,srcKey='src_city';
async function loadTimes(){
 const m=prayMosque?mq(prayMosque):null,p=m?{lat:m.lat,lng:m.lng}:(dist(pos,TOULOUSE)<30?pos:TOULOUSE);
 srcKey=m?'src_'+m.src:'src_city';timesDay=dayKey();
 const req=++timesReq,ck=m?'m'+m.id:'c'+p.lat.toFixed(2)+','+p.lng.toFixed(2),cache=store.get('tcache',{});
 const first=timesFor(m,p);
 horaires=first.h;iqama=first.iq;timesMode=first.mode;
 if(first.mode==='local'&&cache[ck]&&cache[ck].d===timesDay){horaires=cache[ck].t;timesMode='api'}
 prieres();if(typeof checkPrayerTime==='function')checkPrayerTime();
 if(timesMode!=='local')return; // Mawaqit ou déjà confirmé aujourd'hui
 const d=new Date(),ds=String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear();
 try{
  const r=await fetch(`https://api.aladhan.com/v1/timings/${ds}?latitude=${p.lat}&longitude=${p.lng}${methodOf(m)==='mirail'?MIRAIL_Q:'&method=12'}`);
  const j=await r.json();if(req!==timesReq)return; // l'utilisateur a changé de mosquée entre-temps
  const h={};KEYS.forEach(k=>{const v=j.data.timings[API[k]].slice(0,5);if(!/^\d\d:\d\d$/.test(v))throw 0;h[k]=v});
  horaires=h;timesMode='api';
  cache[ck]={d:timesDay,t:h};const ks=Object.keys(cache);if(ks.length>12)delete cache[ks[0]];store.set('tcache',cache);
  prieres();if(typeof checkPrayerTime==='function')checkPrayerTime();
 }catch(e){/* pas de réseau ou API en panne : on garde le calcul du téléphone, identique à la minute près */}
}
const nextOf=h=>{const now=new Date(),c=now.getHours()*60+now.getMinutes(),mins=x=>+x.slice(0,2)*60+ +x.slice(3);const k=KEYS.find(x=>mins(h[x])>c);return k?{k,at:h[k]}:{k:'fajr',at:h.fajr,tomorrow:true}};
function prieres(){
 const now=new Date(),mins=h=>{const[a,b]=h.split(':');return +a*60+ +b},c=now.getHours()*60+now.getMinutes();
 let nxt=KEYS.find(k=>mins(horaires[k])>c),diff;
 if(nxt)diff=mins(horaires[nxt])-c;else{nxt='fajr';diff=1440-c+mins(horaires.fajr)}
 $('#nextName').textContent=t(nxt);
 $('#nextIn').textContent=inTime(diff)+' · '+horaires[nxt];
 renderPmNote();
 const m=prayMosque?mq(prayMosque):null;
 $('#times').innerHTML=KEYS.map(k=>`<div class="${k===nxt?'cur':''}"><span>${t(k)}</span><span dir="ltr">${horaires[k]}${iqama?' <span class="small">· '+t('iqama')+' '+iqama[k]+'</span>':''}</span></div>`).join('')
  +(m&&m.src==='mawaqit'?`<div><span>${t('jumua')}</span><span dir="ltr">${MAWAQIT[m.id].jumua}</span></div>`:'')
  +`<div class="small" style="border:0;display:block">${t(srcKey)}${timesMode==='local'?' '+t('calcLocal'):''}</div>`;
 const r=x=>x*Math.PI/180,K={lat:21.4225,lng:39.8262};
 const y=Math.sin(r(K.lng-pos.lng))*Math.cos(r(K.lat)),x=Math.cos(r(pos.lat))*Math.sin(r(K.lat))-Math.sin(r(pos.lat))*Math.cos(r(K.lat))*Math.cos(r(K.lng-pos.lng));
 const b=(Math.atan2(y,x)*180/Math.PI+360)%360;
 $('#needle').style.transform=`rotate(${b}deg)`;$('#qibla').textContent=t('deg',{d:Math.round(b)});
}
// « dans 13 min » (et non « dans 0 h 13 min ») ; « dans 2 h 05 min » au-delà d'une heure
const inTime=diff=>{const h=Math.floor(diff/60),m=diff%60;return h?t('inT',{h,m:String(m).padStart(2,'0')}):t('inM',{m})};
function fillPm(){$('#pm').innerHTML='<option value="0">'+t('cityTlse')+'</option>'+MOSQUEES.map(m=>`<option value="${m.id}">${esc(m.nom)}</option>`).join('');$('#pm').value=String(prayMosque)}
$('#pm').onchange=e=>{prayMosque=+e.target.value;tempPm=false;store.set('pm',prayMosque);loadTimes()};
// depuis la page d'une mosquée : on montre SES horaires sans changer la mosquée enregistrée (sauf si on le demande)
let tempPm=false;
function showMosqueTimes(id){prayMosque=id;tempPm=id!==store.get('pm',0);fillPm();loadTimes();go('prayers')}
function renderPmNote(){

 $('#pmKeep').onclick=()=>{store.set('pm',prayMosque);tempPm=false;renderPmNote();toast(t('saved'))};
}

function renderStories(){
 const list=MOSQUEES.concat(role==='mosquee'||STORIES[99].length?[DEMO]:[]);
 // nom court lisible : « Mosquée du Mirail » → « Mirail » (et non « du Mirail »)
 const nm=m=>m.nom.replace('Mosquée ','').replace('Grande ','').replace(/\(.*\)/,'').trim().replace(/^(de la |de l'|du |des |d'|de )/i,'').replace(/^./,c=>c.toUpperCase());
 $('#storyRow').innerHTML=list.map(m=>{const has=(STORIES[m.id]||[]).length>0;return `<button class="story ${seen[m.id]||!has?'seen':''}" data-id="${m.id}"><div class="ring"><div class="in"><span style="background:${m.color}">${I.dome}</span></div></div><p>${esc(nm(m))}</p></button>`}).join('');

let tm;
function playStory(id,i=0){
 const m=mq(id),L=STORIES[id]||[];
 if(i>=L.length){closeStory();return}
 seen[id]=1;store.set('seen',seen);
 const v=$('#viewer');v.style.background=m.color;v.classList.add('on');
 v.innerHTML=`<div class="bars">${L.map((_,j)=>`<i><b style="width:${j<i?100:0}%"></b></i>`).join('')}</div><div class="row"><b>${esc(m.nom)}</b></div><button class="x" aria-label="${esc(t('close'))}">×</button><div class="body">${esc(L[i])}</div>`;
 v.querySelector('.x').onclick=closeStory;
 v.onclick=e=>{if(e.target.closest('.x'))return;clearTimeout(tm);playStory(id,i+1)};
 const bar=v.querySelectorAll('.bars b')[i];bar.style.transition='width 4s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%'));
 clearTimeout(tm);tm=setTimeout(()=>playStory(id,i+1),4000);
}
