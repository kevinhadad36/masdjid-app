<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B8F7A">
<title>Masdjid</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--tx:#16191C;--tx2:#53575B;--tx3:#656D78;--brand:#0B8F7A;--brand-d:#08705F;--dark:#121212;--field:#EEF0F2;--line:#E4E7EA}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121416;--tx:#F2F4F5;--tx2:#B5BBC0;--tx3:#8A9199;--field:#23272B;--line:#2C3135;--brand:#18B59D;--brand-d:#139A85}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Nunito Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:24px;font-weight:500;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header{padding:14px 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:28px;line-height:34px;font-weight:700;flex:1}
#back{background:var(--field);border:0;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--tx);display:none}
#langBtn{background:var(--field);border:0;border-radius:1000px;padding:6px 12px;font:700 13px inherit;font-family:inherit;color:var(--tx);cursor:pointer}
main{flex:1;overflow-y:auto;position:relative}
.screen{display:none;padding:0 16px 16px}.screen.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--tx3);font:600 12px/14px inherit;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
.btn{border:0;border-radius:1000px;padding:12px 20px;font:700 16px inherit;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff;width:100%}
.btn:active{background:var(--brand-d)}
.btn.dark{background:var(--dark);color:#fff;font-weight:500;font-size:14px;padding:8px 16px;width:auto}
.btn.ghost{background:var(--field);color:var(--tx)}
.chip{border:0;border-radius:1000px;background:var(--field);color:var(--tx);padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.chip:active,.chip.on{background:var(--brand);color:#fff}
.emo{font-size:28px;background:var(--field);border:0;border-radius:50%;width:52px;height:52px;cursor:pointer}
.muted{color:var(--tx2)}.small{font-size:12px;line-height:14px;color:var(--tx3);font-weight:600}
.card{background:var(--field);border-radius:24px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
h2{font-size:20px;line-height:26px;font-weight:700}
.badge{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-size:12px;font-weight:700}
.badge svg{width:14px;height:14px;fill:var(--brand)}
#s-map{padding:0}
#s-map.on{display:block;height:100%;position:relative}
#map{position:absolute;inset:0;z-index:0;background:#e6ece9}
.leaflet-container{font-family:inherit}
.dark-tiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.pin{background:none;border:0}
.pinb{width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);transition:transform .15s}
.pinb svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:rotate(45deg)}
.pin.sel .pinb{transform:rotate(-45deg) scale(1.25);box-shadow:0 5px 16px rgba(0,0,0,.45)}
.me{width:22px;height:22px;position:relative}
.me i{position:absolute;inset:3px;border-radius:50%;background:#1B6FB5;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.me::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:rgba(27,111,181,.25);animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.me::before{animation:none}}
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:500;pointer-events:none;display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
#bottom>*{pointer-events:auto}
.fab{align-self:flex-end;margin-inline-end:12px;width:48px;height:48px;border-radius:50%;border:0;background:var(--bg);color:var(--brand);box-shadow:0 2px 12px rgba(0,0,0,.3);display:grid;place-items:center;cursor:pointer}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 12px 2px;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.mcard{flex:none;width:min(84%,330px);scroll-snap-align:center;background:var(--bg);border-radius:24px;padding:14px;box-shadow:0 4px 18px rgba(0,0,0,.28);border:2px solid transparent}
.mcard.sel{border-color:var(--brand)}
.mcard .acts{display:flex;gap:8px;margin-top:10px}
.mcard .acts .btn{padding:9px 12px;font-size:14px}
.mcard .acts a.btn{text-decoration:none;text-align:center;flex:none;width:auto}
.mcard .more{display:flex;gap:8px;margin-top:8px}
#routeBar{position:absolute;top:12px;left:12px;right:12px;z-index:600;background:var(--brand);color:#fff;border-radius:20px;padding:12px 16px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#routeBar.on{display:flex}
#routeBar b{font-size:22px;line-height:26px}
#routeBar button{background:rgba(255,255,255,.2);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.mosque{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ico{width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.next{background:var(--brand);color:#fff;border-radius:24px;padding:24px;margin-bottom:12px}
.next .big{font-size:48px;line-height:60px;font-weight:700}
.times div{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:600}
.times div.cur{color:var(--brand);font-weight:700}
#needle{width:64px;height:64px;transition:transform .3s;flex:none}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 0 16px}
.story{flex:none;width:72px;text-align:center;cursor:pointer;background:none;border:0;color:var(--tx);font-family:inherit}
.story .ring{width:68px;height:68px;border-radius:50%;padding:3px;background:conic-gradient(var(--brand),#7BE0CF,var(--brand));margin:0 auto 4px}
.story.seen .ring{background:var(--line)}
.story .in{width:100%;height:100%;border-radius:50%;background:var(--bg);border:3px solid var(--bg)}
.story .in span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.story p{font-size:12px;line-height:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;color:#fff;padding:16px}
#viewer.on{display:flex}
.bars{display:flex;gap:4px;margin-bottom:12px}.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}.bars i b{display:block;height:100%;width:0;background:#fff}
#viewer .body{flex:1;display:grid;place-items:center;text-align:center;font-size:28px;line-height:36px;font-weight:700;padding:24px;white-space:pre-line}
#viewer .x{background:none;border:0;color:#fff;font-size:32px;cursor:pointer;position:absolute;top:28px;inset-inline-end:16px}
.bubble{max-width:80%;padding:10px 14px;border-radius:20px;margin:6px 0;font-weight:600;width:fit-content}
.bubble.me{background:var(--brand);color:#fff;margin-inline-start:auto}
.bubble.other{background:var(--field)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
select,.field{width:100%;background:var(--field);border:0;border-radius:16px;padding:14px 16px;font:500 16px inherit;font-family:inherit;color:var(--tx);margin:6px 0 12px}
label{font-size:14px;font-weight:600;color:var(--tx2)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.menu{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--field);border-radius:24px;margin-bottom:12px;cursor:pointer;border:0;width:100%;text-align:start;font-family:inherit;color:var(--tx);font-size:16px}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--brand)}.sw.on::after{inset-inline-start:23px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:40;transform:translateY(110%);transition:transform .25s;max-height:85%;overflow:auto}
.sheet.on{transform:none}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:1000px;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.step{display:flex;gap:14px;align-items:flex-start}
.step .n{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
.qrbox{background:#fff;color:#16191C;border-radius:24px;padding:24px;text-align:center;border:1px solid var(--line)}
.qrbox svg{width:220px;height:220px;display:block;margin:16px auto}
#printArea{display:none}
@media print{#app{display:none!important}#printArea{display:block!important;text-align:center;font-family:sans-serif;padding:40px;color:#000}#printArea svg{width:340px;height:340px}}
</style>
</head>
<body>
<div id="app">
<header><button id="back" aria-label="back">←</button><h1 id="title"></h1><span id="roleTag" class="badge" hidden></span><button id="langBtn"></button></header>
<main>
 <section class="screen on" id="s-map">
  <div id="map"></div>
  <div id="routeBar"><div class="grow"><b id="rtTime"></b><div class="small" id="rtSub" style="color:#fff;opacity:.9"></div></div><button id="rtClose" aria-label="close">×</button></div>
  <div id="bottom">
   <button class="fab" id="locate" aria-label="locate"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="8.5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
   <div id="cards"></div>
  </div>
 </section>

 <section class="screen" id="s-prayers">
  <select id="pm" aria-label="mosque"></select>
  <div class="next"><div class="small" id="tNext" style="color:#fff;opacity:.85"></div><div class="big" id="nextName">–</div><div id="nextIn" style="font-weight:600">–</div></div>
  <div class="card times" id="times"></div>
  <div class="card row">
   <svg id="needle" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="2"/><path d="M32 6 40 34H24Z" fill="var(--brand)"/><path d="M32 58 24 34H40Z" fill="currentColor" fill-opacity=".25"/></svg>
   <div class="grow"><h2 id="tQibla"></h2><div class="muted" id="qibla">–</div></div>
  </div>
 </section>

 <section class="screen" id="s-stories">
  <div class="stories" id="storyRow"></div>
  <div id="pubBox"></div>
  <p class="small" id="storiesNote"></p>
 </section>

 <section class="screen" id="s-rdv">
  <button class="btn" id="newRdv"></button>
  <div style="height:16px"></div>
  <div id="rdvList"></div>
 </section>

 <section class="screen" id="s-more"><div id="moreBody"></div></section>
 <section class="screen" id="s-family"><div id="familyBody"></div></section>
 <section class="screen" id="s-discover"><div id="discoverBody"></div></section>
 <section class="screen" id="s-qr"><div id="qrBody"></div></section>
 <section class="screen" id="s-settings"><div id="settingsBody"></div></section>
</main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"></div>
<div id="viewer"></div>
<div class="toast" id="toast"></div>
</div>
<div id="printArea"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="i18n.js"></script>
<script src="mosques.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('m_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('m_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',(navigator.language||'fr').slice(0,2));if(!TR[lang])lang='fr';
const t=(k,v)=>{let s=(TR[lang]&&TR[lang][k])||TR.fr[k]||k;if(v)for(const x in v)s=s.replace('{'+x+'}',v[x]);return s};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const I={
 map:'<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 prayers:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 stories:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-dasharray="4 3"/><circle cx="12" cy="12" r="4"/></svg>',
 rdv:'<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
 dome:'<svg viewBox="0 0 24 24"><path d="M4 21V13a8 8 0 0 1 16 0v8M2 21h20M12 2v3"/></svg>',
 family:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="10" r="2.2"/><path d="M2 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5M15 20c0-2.5 1.5-4 4-4s3 1.5 3 4"/></svg>',
 book:'<svg viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6M20 4v14h-6"/></svg>',
 qr:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v7h-3"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M12 1l3 2 3.5-.2 1.2 3.3 3 1.9-1.2 3.3 1.2 3.3-3 1.9-1.2 3.3L15 21l-3 2-3-2-3.5.2-1.2-3.3-3-1.9 1.2-3.3L.3 8.9l3-1.9L4.5 3.8 8 4z"/><path d="M8 12l3 3 5-6" stroke="#fff" fill="none" stroke-width="2"/></svg>'
};
const TABS=['map','prayers','stories','rdv','more'];
const SUB={family:'more',discover:'more',qr:'more',settings:'more'};
let cur='map';
const toast=m=>{const x=$('#toast');x.textContent=m;x.classList.add('on');setTimeout(()=>x.classList.remove('on'),2000)};

/* ---------- données d'exemple (fictives) ---------- */
const TOULOUSE={lat:43.6047,lng:1.4442}; // ville de départ du projet
let pos=store.get('pos',TOULOUSE);
const STORIES={};
const PRAYERS=['jumua','fajr','dhuhr','asr','maghrib','isha','tarawih','eid'];
const dist=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const mq=id=>id===99?DEMO:MOSQUEES.find(m=>m.id===id);

/* ---------- navigation ---------- */
function go(k){
 cur=k;const tab=SUB[k]||k;
 $$('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));
 $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 $('#sheet').classList.remove('on');
 $('#back').style.display=SUB[k]?'block':'none';
 $('#back').textContent=RTL.includes(lang)?'→':'←';
 setTitle();renderCurrent();
 if(k==='map'&&map)setTimeout(()=>map.invalidateSize(),50);
}
function setTitle(){$('#title').textContent=cur==='map'?t('mosques'):t(cur==='discover'?'discover':cur)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};
$('#back').onclick=()=>go('more');
function renderCurrent(){
 ({rdv:renderRdv,more:renderMore,family:renderFamily,discover:renderDiscover,qr:renderQr,settings:renderSettings}[cur]||(()=>{}))();
}

/* ---------- langue ---------- */
function applyLang(){
 document.documentElement.lang=lang;document.documentElement.dir=RTL.includes(lang)?'rtl':'ltr';
 $('#langBtn').textContent='🌐 '+lang.toUpperCase();
 $('#nav').innerHTML=TABS.map(k=>`<button data-t="${k}" class="${(SUB[cur]||cur)===k?'on':''}">${I[k]}<span>${t(k)}</span></button>`).join('');
 $('#locate').setAttribute('aria-label',t('locate'));$('#tNext').textContent=t('nextPrayer');$('#tQibla').textContent=t('qibla');
 $('#storiesNote').textContent=t('storiesNote');$('#newRdv').textContent=t('newRdv');
 setTitle();fillPm();renderList();loadTimes();renderStories();renderRole();renderRdv();renderCurrent();
 $('#back').textContent=RTL.includes(lang)?'→':'←';
}
function pickLang(){
 $('#sheet').innerHTML=`<h2 style="margin-bottom:12px">${t('language')}</h2><div class="chips" style="margin:0 0 16px">${Object.keys(LANGS).map(k=>`<button class="chip ${k===lang?'on':''}" data-l="${k}">${LANGS[k]}</button>`).join('')}</div><button class="btn ghost" id="lcl">${t('close')}</button>`;
 $('#sheet').classList.add('on');$('#lcl').onclick=()=>$('#sheet').classList.remove('on');
}
$('#sheet').addEventListener('click',e=>{const c=e.target.closest('[data-l]');if(c){lang=c.dataset.l;store.set('lang',lang);$('#sheet').classList.remove('on');applyLang()}});
$('#langBtn').onclick=pickLang;

/* ---------- carte (style navigation) ---------- */
let map,pins={},userMk,routeLines=[],selected=null,watchId=null;
const isDark=()=>{const r=document.documentElement.dataset.theme;return r==='dark'||(r!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};
const pinIcon=(m,sel)=>L.divIcon({className:'pin'+(sel?' sel':''),html:'<div class="pinb" style="background:'+m.color+'">'+I.dome+'</div>',iconSize:[40,46],iconAnchor:[8,44]});
function initMap(){
 if(!window.L){$('#map').innerHTML='<div class="muted" style="padding:24px">…</div>';return}
 map=L.map('map',{zoomControl:false,attributionControl:false}).setView([pos.lat,pos.lng],12);
 if(isDark())$('#map').classList.add('dark-tiles');
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
 L.control.attribution({prefix:false,position:'topright'}).addAttribution('© OpenStreetMap').addTo(map);
 MOSQUEES.forEach(m=>{pins[m.id]=L.marker([m.lat,m.lng],{icon:pinIcon(m)}).addTo(map).on('click',()=>selectMosque(m.id))});
 userMk=L.marker([pos.lat,pos.lng],{icon:L.divIcon({className:'',html:'<div class="me"><i></i></div>',iconSize:[22,22]}),interactive:false,zIndexOffset:900}).addTo(map);
 const b=L.latLngBounds(MOSQUEES.filter(m=>dist(pos,m)<12).map(m=>[m.lat,m.lng]).concat([[pos.lat,pos.lng]]));map.fitBounds(b,{paddingTopLeft:[30,30],paddingBottomRight:[30,260]});
}
function renderList(){renderCards()}
function renderCards(){
 const l=MOSQUEES.map(m=>({...m,d:dist(pos,m)})).sort((a,b)=>a.d-b.d);
 $('#cards').innerHTML=l.map(m=>`<div class="mcard ${m.id===selected?'sel':''}" data-id="${m.id}"><div class="row"><div class="ico" style="background:${m.color}">${I.dome}</div><div class="grow"><b>${esc(m.nom)}</b><div class="small">${esc(m.adr)}</div></div><div class="small">${m.d.toFixed(1)} km</div></div>
 <div class="acts"><button class="btn" data-act="route">${t('route')}</button><a class="btn ghost" target="_blank" rel="noopener" href="https://waze.com/ul?ll=${m.lat},${m.lng}&navigate=yes">Waze</a><a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}&travelmode=driving">Maps</a></div>
 <div class="more"><button class="chip" data-act="cov">${t('carpool')}</button><button class="chip" data-act="info">Infos</button></div></div>`).join('');
}
$('#cards').onclick=e=>{
 const c=e.target.closest('.mcard');if(!c)return;const id=+c.dataset.id,a=e.target.closest('[data-act]');
 if(!a)return selectMosque(id,true);
 if(a.dataset.act==='route')showRoute(id);else if(a.dataset.act==='cov')newRdvSheet(id);else if(a.dataset.act==='info')openMosque(id);
};
function selectMosque(id,fromCard){
 selected=id;const m=mq(id);
 for(const k in pins)pins[k].setIcon(pinIcon(mq(+k),+k===id));
 renderCards();
 const c=$('#cards').querySelector('[data-id="'+id+'"]');if(c&&!fromCard)c.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
 if(map)map.flyTo([m.lat,m.lng],Math.max(map.getZoom(),14),{duration:.6});
}
async function showRoute(id){
 const m=mq(id);selected=id;renderCards();clearRoute();
 const from=dist(pos,TOULOUSE)<60?pos:TOULOUSE;
 try{
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${from.lng},${from.lat};${m.lng},${m.lat}?overview=full&geometries=geojson`);
  const j=await r.json(),rt=j.routes[0],pts=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
  routeLines=[L.polyline(pts,{color:'#fff',weight:10,opacity:.95}).addTo(map),L.polyline(pts,{color:'#0B8F7A',weight:6}).addTo(map)];
  map.fitBounds(routeLines[1].getBounds(),{paddingTopLeft:[40,90],paddingBottomRight:[40,260]});
  $('#rtTime').textContent=t('routeInfo',{m:Math.max(1,Math.round(rt.duration/60)),d:(rt.distance/1000).toFixed(1)});
  $('#rtSub').textContent=m.nom+' · '+(from===pos&&hasFix?t('fromYou'):t('fromCenter'));
  $('#routeBar').classList.add('on');
 }catch(e){toast(t('routeFail'))}
}
function clearRoute(){routeLines.forEach(l=>map.removeLayer(l));routeLines=[];$('#routeBar').classList.remove('on')}
$('#rtClose').onclick=clearRoute;
function openMosque(id){
 const m=mq(id);
 $('#sheet').innerHTML=`<div class="row"><div class="ico">${I.dome}</div><div class="grow"><h2>${esc(m.nom)}</h2><div class="small">${dist(pos,m).toFixed(1)} km</div></div></div><p class="muted" style="margin:12px 0 4px">${esc(m.adr)}</p>${m.site?`<p style="margin-bottom:4px"><a href="${m.site}" target="_blank" rel="noopener" style="color:var(--brand);font-weight:700">${t('site')}</a></p>`:''}<p class="small" style="margin-bottom:12px">${t('src_'+m.src)}</p>
 <button class="btn" id="cov">${t('carpool')}</button><div style="height:8px"></div><button class="btn ghost" id="cl">${t('close')}</button>`;
 $('#sheet').classList.add('on');
 $('#cl').onclick=()=>$('#sheet').classList.remove('on');
 $('#cov').onclick=()=>newRdvSheet(id);
}
let hasFix=false;
function onFix(p,first){
 pos={lat:p.coords.latitude,lng:p.coords.longitude};store.set('pos',pos);hasFix=true;
 if(userMk)userMk.setLatLng([pos.lat,pos.lng]);
 renderCards();
 if(first){loadTimes();if(map)map.flyTo([pos.lat,pos.lng],14,{duration:.8});toast(t('posOk'))}
}
$('#locate').onclick=()=>{
 if(!navigator.geolocation)return toast(t('posNo'));
 if(watchId!==null&&hasFix){if(map)map.flyTo([pos.lat,pos.lng],15,{duration:.6});return}
 let first=true;
 watchId=navigator.geolocation.watchPosition(p=>{onFix(p,first);first=false},()=>{toast(t('posNo'));watchId=null},{enableHighAccuracy:true,maximumAge:5000});
};

/* ---------- prières (par mosquée) ---------- */
const FALLBACK={fajr:'06:12',dhuhr:'13:05',asr:'15:48',maghrib:'18:02',isha:'19:30'};
const KEYS=['fajr','dhuhr','asr','maghrib','isha'],API={fajr:'Fajr',dhuhr:'Dhuhr',asr:'Asr',maghrib:'Maghrib',isha:'Isha'};
// Méthode du site de la mosquée du Mirail : Ligue islamique mondiale, Fajr/Isha 15°, Dhuhr +1 min, Maghrib +5 min
const MIRAIL_Q='&method=99&methodSettings=15,null,15&tune=0,0,0,1,0,5,0,0,0';
let prayMosque=store.get('pm',0),horaires=FALLBACK,live=false,iqama=null,srcKey='src_city';
const addMin=(h,n)=>{const[a,b]=h.split(':').map(Number),t=a*60+b+n;return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
async function loadTimes(){
 const m=prayMosque?mq(prayMosque):null,p=m?{lat:m.lat,lng:m.lng}:(dist(pos,TOULOUSE)<30?pos:TOULOUSE);iqama=null;
 srcKey=m?'src_'+m.src:'src_city';
 if(m&&m.src==='mawaqit'){
  const d=new Date(),row=MURET.cal[d.getMonth()][d.getDate()];
  horaires={fajr:row[0],dhuhr:row[2],asr:row[3],maghrib:row[4],isha:row[5]};
  iqama={};['fajr','dhuhr','asr','maghrib'].forEach(k=>iqama[k]=addMin(horaires[k],MURET.iqamaMin));iqama.isha=MURET.ishaIqama;live=true;return prieres();
 }
 const method=(m&&m.src==='mirail')?MIRAIL_Q:'&method=12';
 try{const r=await fetch(`https://api.aladhan.com/v1/timings?latitude=${p.lat}&longitude=${p.lng}${method}`);const j=await r.json();
  horaires={};KEYS.forEach(k=>horaires[k]=j.data.timings[API[k]].slice(0,5));live=true}
 catch(e){horaires=FALLBACK;live=false}
 prieres();
}
function prieres(){
 const now=new Date(),mins=h=>{const[a,b]=h.split(':');return +a*60+ +b},c=now.getHours()*60+now.getMinutes();
 let nxt=KEYS.find(k=>mins(horaires[k])>c),diff;
 if(nxt)diff=mins(horaires[nxt])-c;else{nxt='fajr';diff=1440-c+mins(horaires.fajr)}
 $('#nextName').textContent=t(nxt);
 $('#nextIn').textContent=t('inT',{h:Math.floor(diff/60),m:String(diff%60).padStart(2,'0')})+' · '+horaires[nxt];
 const m=prayMosque?mq(prayMosque):null;
 $('#times').innerHTML=KEYS.map(k=>`<div class="${k===nxt?'cur':''}"><span>${t(k)}</span><span dir="ltr">${horaires[k]}${iqama?' <span class="small">· '+t('iqama')+' '+iqama[k]+'</span>':''}</span></div>`).join('')
  +(m&&m.src==='mawaqit'?`<div><span>${t('jumua')}</span><span dir="ltr">${MURET.jumua}</span></div>`:'')
  +`<div class="small" style="border:0;display:block">${live?t(srcKey):t('demoTimes')}</div>`;
 const r=x=>x*Math.PI/180,K={lat:21.4225,lng:39.8262};
 const y=Math.sin(r(K.lng-pos.lng))*Math.cos(r(K.lat)),x=Math.cos(r(pos.lat))*Math.sin(r(K.lat))-Math.sin(r(pos.lat))*Math.cos(r(K.lat))*Math.cos(r(K.lng-pos.lng));
 const b=(Math.atan2(y,x)*180/Math.PI+360)%360;
 $('#needle').style.transform=`rotate(${b}deg)`;$('#qibla').textContent=t('deg',{d:Math.round(b)});
}
function fillPm(){$('#pm').innerHTML='<option value="0">'+t('cityTlse')+'</option>'+MOSQUEES.map(m=>`<option value="${m.id}">${esc(m.nom)}</option>`).join('');$('#pm').value=String(prayMosque)}
$('#pm').onchange=e=>{prayMosque=+e.target.value;store.set('pm',prayMosque);loadTimes()};

/* ---------- rôle ---------- */
let role=store.get('role','fidele');
function renderRole(){
 const m=role==='mosquee';
 $('#roleTag').hidden=!m;$('#roleTag').innerHTML=m?I.check+t('verified'):'';
 $('#pubBox').innerHTML=m?`<div class="card"><h2>${t('pubTitle')}</h2><input class="field" id="stTxt" placeholder="${t('pubPh')}"><button class="btn" id="stPub">${t('pubBtn')}</button></div>`:'';
 if(m)$('#stPub').onclick=()=>{const v=$('#stTxt').value.trim();if(!v)return toast(t('pubEmpty'));STORIES[99].unshift(v);store.set('st99',STORIES[99]);renderStories();$('#stTxt').value='';toast(t('pubDone'))};
}

/* ---------- stories (lecture seule pour les fidèles) ---------- */
let seen=store.get('seen',{});STORIES[99]=store.get('st99',[]);
function renderStories(){
 const list=MOSQUEES.concat(role==='mosquee'||STORIES[99].length?[DEMO]:[]);
 const nm=m=>m.nom.replace('Mosquée ','').replace('Grande ','').replace(/\(.*\)/,'').trim();
 $('#storyRow').innerHTML=list.map(m=>{const has=(STORIES[m.id]||[]).length>0;return `<button class="story ${seen[m.id]||!has?'seen':''}" data-id="${m.id}"><div class="ring"><div class="in"><span style="background:${m.color}">${esc(nm(m)[0])}</span></div></div><p>${esc(nm(m))}</p></button>`}).join('');
}
$('#storyRow').onclick=e=>{const b=e.target.closest('.story');if(!b)return;const id=+b.dataset.id;if(!(STORIES[id]||[]).length)return toast(t('noStory'));playStory(id)};
let tm;
function playStory(id,i=0){
 const m=mq(id),L=STORIES[id]||[];
 if(i>=L.length){closeStory();return}
 seen[id]=1;store.set('seen',seen);
 const v=$('#viewer');v.style.background=m.color;v.classList.add('on');
 v.innerHTML=`<div class="bars">${L.map((_,j)=>`<i><b style="width:${j<i?100:0}%"></b></i>`).join('')}</div><div class="row"><b>${esc(m.nom)}</b></div><button class="x" aria-label="close">×</button><div class="body">${esc(L[i])}</div>`;
 v.querySelector('.x').onclick=closeStory;
 v.onclick=e=>{if(e.target.closest('.x'))return;clearTimeout(tm);playStory(id,i+1)};
 const bar=v.querySelectorAll('.bars b')[i];bar.style.transition='width 4s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='100%'));
 clearTimeout(tm);tm=setTimeout(()=>playStory(id,i+1),4000);
}
function closeStory(){clearTimeout(tm);$('#viewer').classList.remove('on');renderStories()}

/* ---------- rendez-vous / covoiturage (messages prédéfinis uniquement, toutes les prières) ---------- */
let rdvs=store.get('rdvs',[]).filter(r=>r&&mq(r.m)&&r.p&&Array.isArray(r.msgs));
const PRESETS=['p0','p1','p2','p3','p4','p5'];
function newRdvSheet(preMosque){
 $('#sheet').innerHTML=`<h2>${t('newRdv')}</h2>
 <label>${t('lMosque')}</label><select id="rm">${MOSQUEES.map(m=>`<option value="${m.id}" ${m.id===preMosque?'selected':''}>${esc(m.nom)}</option>`).join('')}</select>
 <label>${t('lPrayer')}</label><select id="rp">${PRAYERS.map(p=>`<option value="${p}">${t(p)}</option>`).join('')}</select>
 <div class="chips" style="margin:0 0 16px"><button class="chip on" data-r="offer">${t('offer')}</button><button class="chip" data-r="seek">${t('seek')}</button></div>
 <button class="btn" id="rok">${t('create')}</button><div style="height:8px"></div><button class="btn ghost" id="rcl">${t('cancel')}</button>`;
 $('#sheet').classList.add('on');
 let kind='offer';
 $$('[data-r]').forEach(b=>b.onclick=()=>{kind=b.dataset.r;$$('[data-r]').forEach(x=>x.classList.toggle('on',x===b))});
 $('#rcl').onclick=()=>$('#sheet').classList.remove('on');
 $('#rok').onclick=()=>{rdvs.unshift({id:Date.now(),m:+$('#rm').value,p:$('#rp').value,kind,msgs:[{from:'other',k:'leave'}]});store.set('rdvs',rdvs);$('#sheet').classList.remove('on');go('rdv');toast(t('created'))};
}
$('#newRdv').onclick=()=>newRdvSheet();
function renderRdv(){
 $('#rdvList').innerHTML=rdvs.length?rdvs.map(r=>`<div class="card" data-id="${r.id}"><div class="row"><div class="ico">${I.rdv}</div><div class="grow"><b>${esc(mq(r.m).nom)}</b><div class="small">${t(r.p)} · ${t(r.kind)}</div></div></div>
 <div style="margin-top:8px">${r.msgs.map(m=>`<div class="bubble ${m.from}">${t(m.k)}</div>`).join('')}</div>
 <div class="chips">${PRESETS.map(p=>`<button class="chip" data-p="${p}">${t(p)}</button>`).join('')}</div></div>`).join(''):`<p class="muted" style="text-align:center;margin-top:32px">${t('noRdv')}</p>`;
}
$('#rdvList').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const r=rdvs.find(x=>x.id===+c.closest('.card').dataset.id);r.msgs.push({from:'me',k:c.dataset.p});store.set('rdvs',rdvs);renderRdv()};

/* ---------- Plus ---------- */
function renderMore(){
 const items=[['family','family','familyD'],['discover','book','discoverD'],['qr','qr','qrD'],['settings','gear',null]];
 $('#moreBody').innerHTML=items.map(([k,ic,d])=>`<button class="menu" data-go="${k}"><div class="ico">${I[ic]}</div><div class="grow"><b>${t(k)}</b>${d?`<div class="small">${t(d)}</div>`:''}</div></button>`).join('');
}
$('#moreBody').onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};

/* ---------- Famille : parents → enfants ---------- */
let fam=store.get('fam',{mode:'parent',inbox:[]});
const REM=['r0','r1','r2'],SRC=['Bukhari & Muslim','Bukhari & Muslim','Bukhari & Muslim'],EMOJI=['👍','🤲','❤️'];
function renderFamily(){
 const p=fam.mode==='parent';
 let h=`<div class="chips" style="margin:0 0 16px"><button class="chip ${p?'on':''}" data-m="parent">${t('parent')}</button><button class="chip ${p?'':'on'}" data-m="child">${t('child')}</button></div>`;
 if(p)h+=`<h2 style="margin-bottom:12px">${t('remindTitle')}</h2>`+REM.map((k,i)=>`<div class="card"><p>${t(k)}</p><div class="small" style="margin:6px 0 12px">${t('src')} : ${SRC[i]}</div><button class="btn" data-send="${i}">${t('remindTitle')}</button></div>`).join('');
 else h+=`<h2 style="margin-bottom:12px">${t('inbox')}</h2>`+(fam.inbox.length?fam.inbox.map((x,j)=>`<div class="card"><p>${t(REM[x.i])}</p>${x.r?`<div style="font-size:32px;margin-top:8px">${x.r}</div>`:`<div class="small" style="margin:8px 0">${t('replyHint')}</div><div class="row">${EMOJI.map(e=>`<button class="emo" data-rep="${j}" data-e="${e}">${e}</button>`).join('')}</div>`}</div>`).join(''):`<p class="muted">${t('none')}</p>`);
 $('#familyBody').innerHTML=h;
}
$('#familyBody').onclick=e=>{
 const m=e.target.closest('[data-m]'),s=e.target.closest('[data-send]'),r=e.target.closest('[data-rep]');
 if(m){fam.mode=m.dataset.m}
 if(s){fam.inbox.unshift({i:+s.dataset.send,r:null});toast(t('sent'))}
 if(r){fam.inbox[+r.dataset.rep].r=r.dataset.e}
 if(m||s||r){store.set('fam',fam);renderFamily()}
};

/* ---------- Découvrir l'islam ---------- */
function renderDiscover(){
 $('#discoverBody').innerHTML=[1,2,3,4].map(n=>`<div class="card step"><div class="n">${n}</div><div><b>${t('d'+n+'t')}</b><p class="muted">${t('d'+n)}</p></div></div>`).join('')+`<button class="btn" id="talk">${t('talk')}</button>`;
 $('#talk').onclick=()=>toast(t('talkDone'));
}

/* ---------- QR code mosquée ---------- */
let qrMosque=1;
function qrSvg(){const q=qrcode(0,'M');q.addData(location.href.split('#')[0]);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true})}
function poster(m,fn){return `<div ${fn||''}><div class="small" style="color:#555">${t('qrTitle')}</div><h2 style="font-size:26px;margin-top:6px">${esc(m.nom)}</h2>${window.qrcode?qrSvg():''}<b>${t('qrScan')}</b></div>`}
function renderQr(){
 const m=mq(qrMosque);
 $('#qrBody').innerHTML=`<label>${t('lMosque')}</label><select id="qm">${MOSQUEES.map(x=>`<option value="${x.id}" ${x.id===qrMosque?'selected':''}>${esc(x.nom)}</option>`).join('')}</select><div class="qrbox">${poster(m)}</div><div style="height:12px"></div><button class="btn" id="qp">${t('qrPrint')}</button>`;
 $('#qm').onchange=e=>{qrMosque=+e.target.value;renderQr()};
 $('#qp').onclick=()=>{$('#printArea').innerHTML=poster(m);window.print()};
}

/* ---------- Réglages ---------- */
const prefs=store.get('prefs',{reminders:true,notifs:true,share:false});
let spent=store.get('spent',0);
function renderSettings(){
 const m=role==='mosquee';
 $('#settingsBody').innerHTML=`<div class="card row"><div class="ico" style="width:56px;height:56px">${I.dome}</div><div class="grow"><h2>${m?t('roleMosque'):t('roleFidele')}</h2></div></div>`+
 ['reminders','notifs','share'].map(k=>`<div class="set"><span>${t(k)}</span><button class="sw ${prefs[k]?'on':''}" data-k="${k}"></button></div>`).join('')+
 `<div class="set"><span>${t('language')}</span><button class="chip" id="sl">${LANGS[lang]}</button></div><div class="set"><span>${t('spent')}</span><span class="small" id="spent">${Math.floor(spent/60)} min</span></div>
 <div style="height:16px"></div><div class="card"><div class="small" style="margin-bottom:8px">${t('demo')}</div><button class="btn ghost" id="roleBtn">${m?t('toFidele'):t('toMosque')}</button></div>`;
 $$('#settingsBody .sw').forEach(s=>s.onclick=()=>{prefs[s.dataset.k]=!prefs[s.dataset.k];store.set('prefs',prefs);s.classList.toggle('on',prefs[s.dataset.k])});
 $('#sl').onclick=pickLang;
 $('#roleBtn').onclick=()=>{role=m?'fidele':'mosquee';store.set('role',role);renderRole();renderSettings()};
}
setInterval(()=>{spent++;store.set('spent',spent);const e=$('#spent');if(e)e.textContent=Math.floor(spent/60)+' min'},1000);

/* ---------- démarrage ---------- */
initMap();applyLang();loadTimes();setInterval(prieres,30000);
</script>
